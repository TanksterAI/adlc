[package]
name = "adlc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "ADLC Execution Harness: adversarial test-case generation for MCP tool calls, judged by filesystem state-transition diffs rather than output text."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
